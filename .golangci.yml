version: "2"

run:
  timeout: 5m
  # Analyze the development build variant: the dev panel mounts only under
  # the arr_dev tag, and linting without it would flag its support code as
  # unused. Compile coverage of the release variant comes from go build/test.
  build-tags:
    - arr_dev

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
    - forbidigo

  settings:
    staticcheck:
      checks:
        - all
        - -QF1001
        - -QF1012

    forbidigo:
      analyze-types: true
      forbid:
        # Simulation code may use only operations with reproducible results:
        # + - * /, math.Sqrt, math.Mod, and math.Modf. Transcendentals can
        # vary by architecture, so simulation code uses dmath instead. The
        # ease/ and ui/ packages and platform backends are exempt.
        - pattern: ^math\.(Sin|Cos|Tan|Asin|Acos|Atan|Atan2|Exp|Pow|Log|Log2|Log10)$
          msg: "forbidden in simulation path: use dmath, or only + - * / and math.Sqrt"

  exclusions:
    rules:
      # Tests are outside the simulation path. The dmath suite compares its
      # results with libm on purpose.
      - path: _test\.go
        linters:
          - errcheck
          - forbidigo

      # The checker covers simulation packages. Examples and dmath contain
      # deliberate exceptions: examples are presentation code, while dmath
      # implements the replacements.
      - path-except: '^(scene|runtime|examples|dmath)/'
        linters:
          - forbidigo

      # These files call math only while building render commands or
      # presentation offsets. That state never enters snapshots, checksums,
      # or replay. Render code keeps math.* because dmath.Sin/Cos reject
      # arguments beyond 2^20 and ctx.Time is unbounded.
      - path: 'examples/(football/(game|world)|particles/game|outpost/game|uimanager/(game|screen_dashboard)|bench/shapebench/game)\.go'
        linters:
          - forbidigo
