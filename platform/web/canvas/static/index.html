<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrameForge Canvas</title>
    <link rel="stylesheet" href="/static/style/style.css">
</head>
<body>
    <header>
        <h1>FrameForge Canvas</h1>
        <div class="toolbar">
            <span id="stats">connecting...</span>
            <span id="history">history 0</span>
            <button id="play-pause" type="button">Pause</button>
            <button id="back" type="button">Back</button>
            <label>
                Seconds
                <input id="back-seconds-value" type="number" min="0.016" step="0.25" value="1">
                <button id="back-seconds" type="button">Back</button>
            </label>
            <label>
                Tick
                <input id="back-tick-value" type="number" min="0" step="1" value="0">
                <button id="back-tick" type="button">Go</button>
            </label>
            <button id="step" type="button">Step</button>
            <button id="reset" type="button">Reset</button>
            <label>
                Speed
                <input id="speed" type="range" min="0.25" max="8" step="0.25" value="1">
                <span id="speed-value">1x</span>
            </label>
            <details class="debug-menu">
                <summary>Debug</summary>

                <div class="debug-options">
                    <label>
                        <input type="checkbox" data-debug-layer="colliders">
                        Colliders
                    </label>
                    <label>
                        <input type="checkbox" data-debug-layer="contacts">
                        Contacts
                    </label>
                    <label>
                        <input type="checkbox" data-debug-layer="grid">
                        Grid
                    </label>
                    <label>
                        <input type="checkbox" data-debug-layer="activeGrid">
                        Active grid
                    </label>
                    <label>
                        <input type="checkbox" data-debug-layer="candidateGrid">
                        Candidate grid
                    </label>
                </div>
            </details>
        </div>
    </header>

    <main>
        <canvas id="ff-canvas"></canvas>
    </main>

    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
