# Temporary probe: measures the invariant-divisor contact bench on Apple
# Silicon and server arm64, where bits.Div64 has no 128/64 hardware
# instruction, with an x86 runner as reference. Delete this file after
# the divide-per-use decision is recorded.
name: bench-divider

on:
  push:
    branches: [probe/fixed]
    paths:
      - .github/workflows/bench-divider.yml
      - internal/fixedprobe/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04-arm, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: hardware
        run: uname -m && (sysctl -n machdep.cpu.brand_string || grep -m1 'model name' /proc/cpuinfo || true)
      - name: bench
        run: go test ./internal/fixedprobe/ -run - -bench ContactSolverDivider -count=10 -timeout 30m
