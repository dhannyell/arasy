name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Build dependencies of the native host on Linux: GLFW needs the X11 and
  # Wayland development headers, oto needs ALSA, and the WebGPU binding needs
  # EGL and a Vulkan loader. Every Linux job compiles ./... and therefore
  # compiles the host, so all of them install these.
  NATIVE_LINUX_DEPS: >-
    libegl1-mesa-dev mesa-vulkan-drivers libasound2-dev
    libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev
    libxkbcommon-dev libwayland-dev

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: native build dependencies
        run: sudo apt-get update && sudo apt-get install -y $NATIVE_LINUX_DEPS

      - name: actionlint
        uses: raven-actions/actionlint@v2
        with:
          shellcheck: false
          pyflakes: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

      # The config analyzes the development variant, where the dev panel
      # exists. This pass covers the other side of every tag-gated seam --
      # the release stubs -- which the first pass compiles out.
      - name: golangci-lint (release variant)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          args: --build-tags= ./...

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...
          repo-checkout: false

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: native build dependencies
        run: sudo apt-get update && sudo apt-get install -y $NATIVE_LINUX_DEPS
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "file out gofmt:"; echo "$out"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: build (release and dev variants)
        run: |
          go build ./...
          go build -tags arr_dev ./...
      - name: test
        run: go test ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: native build dependencies
        run: sudo apt-get update && sudo apt-get install -y $NATIVE_LINUX_DEPS
      - name: test -race
        run: go test -race ./...
      # The dev panel and the accessors it needs compile out of the release
      # variant above, so the race net has to reach them under the tag.
      - name: test -race (arr_dev variant)
        run: go test -race -tags arr_dev ./internal/devpanel/... ./runtime/...

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        run: go test ./...
      - name: test (arr_dev variant)
        run: go test -tags arr_dev ./platform/native/... ./internal/devpanel/... ./runtime/...

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build + vet (js/wasm, all packages)
        env:
          GOOS: js
          GOARCH: wasm
        run: |
          go build ./...
          go build -tags arr_dev ./...
          go vet ./...
          go vet -tags arr_dev ./...
      - name: test (js/wasm, sim path)
        env:
          GOOS: js
          GOARCH: wasm
        run: |
          export PATH="$PATH:$(go env GOROOT)/lib/wasm"
          go test ./scene/... ./runtime/... ./math2d/... ./ease/... ./examples/... ./platform/wasm/...
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: wasm visual golden tests
        run: npm run test:wasm-golden -- --project=canvas2d
      - name: upload wasm golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-golden-failures
          path: test-results/
          if-no-files-found: ignore

  arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: native build dependencies
        run: sudo apt-get update && sudo apt-get install -y $NATIVE_LINUX_DEPS
      - name: test
        run: go test ./...

  # Tier 2: CI compiles and tests the host here, and a human validates a real
  # window on a Linux machine before a release tag. The tests below never open
  # a window or touch a GPU, so a headless runner is enough.
  native-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: native build dependencies
        run: sudo apt-get update && sudo apt-get install -y $NATIVE_LINUX_DEPS
      - name: build + test (native host)
        run: |
          go build ./platform/native/...
          go test ./platform/native/...
      - name: build + test (native host, arr_dev variant)
        run: |
          go build -tags arr_dev ./platform/native/...
          go test -tags arr_dev ./platform/native/...
      - name: build the native examples
        run: go build ./examples/...

  # Tier 3: this compiles, and nobody has played it. The job is advisory on
  # purpose -- the project has no macOS hardware to validate a window, an
  # event loop or an audio device on, so a red mark here must not read as a
  # broken release. Read a green mark as "it still compiles", nothing more.
  native-macos:
    name: native-macos (tier 3, untested)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build (native host)
        run: |
          go build ./platform/native/...
          go build -tags arr_dev ./platform/native/...
