name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: actionlint
        uses: raven-actions/actionlint@v2
        with:
          shellcheck: false
          pyflakes: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...
          repo-checkout: false

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "file out gofmt:"; echo "$out"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test -race
        run: go test -race ./...

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        run: go test ./...

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build + vet (js/wasm, all packages)
        env:
          GOOS: js
          GOARCH: wasm
        run: |
          go build ./...
          go vet ./...
      - name: test (js/wasm, sim path)
        env:
          GOOS: js
          GOARCH: wasm
        run: |
          export PATH="$PATH:$(go env GOROOT)/lib/wasm"
          go test ./scene/... ./runtime/... ./math2d/... ./ease/... ./examples/...
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: wasm visual golden tests
        run: npm run test:wasm-golden -- --project=canvas2d
      - name: upload wasm golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-golden-failures
          path: test-results/
          if-no-files-found: ignore

  arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        run: go test ./...

  fuzz:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target:
          - FuzzDeterminism
          - FuzzReplayFidelity
          - FuzzRewindConvergence
          - FuzzNumericSanity
          - FuzzRecordingCodec
          - FuzzNoPanic
          - FuzzResetReproducibility
          - FuzzScrubBidirectional
          - FuzzSpeedIndependence
          - FuzzDespawnMidRun
          - FuzzSubstepTunneling
          - FuzzForkAfterScrubDeterminism
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: fuzz ${{ matrix.target }}
        run: go test ./internal/simfuzz -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 120s
      - name: upload fuzz repros on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-repro-${{ matrix.target }}
          path: |
            internal/simfuzz/testdata/repro/
            internal/simfuzz/testdata/fuzz/
          if-no-files-found: ignore
