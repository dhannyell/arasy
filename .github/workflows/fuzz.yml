# Simulation fuzzing.
#
# This runs on a schedule and on demand, not on pull requests. Fuzzing with a
# fixed time budget is not a useful pull-request gate: it costs twelve runners
# for two minutes each on every push, and a fixed budget either blocks merges
# on a flaky timeout or is marked non-blocking and then ignored by everyone.
#
# The pull-request signal already exists and is free: `go test ./...` runs the
# committed seed corpus of every target in milliseconds. This workflow is the
# part that explores for *new* failures, and a failure here is meant to be
# triaged into the corpus rather than to block a merge.
name: Fuzz

on:
  schedule:
    # 04:00 UTC daily.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Fuzz budget per target (Go duration)"
        required: false
        default: "120s"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - FuzzDeterminism
          - FuzzReplayFidelity
          - FuzzRewindConvergence
          - FuzzNumericSanity
          - FuzzRecordingCodec
          - FuzzNoPanic
          - FuzzResetReproducibility
          - FuzzScrubBidirectional
          - FuzzSpeedIndependence
          - FuzzDespawnMidRun
          - FuzzSubstepTunneling
          - FuzzForkAfterScrubDeterminism
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: fuzz ${{ matrix.target }}
        run: |
          go test ./internal/simfuzz \
            -run '^$' \
            -fuzz '^${{ matrix.target }}$' \
            -fuzztime '${{ inputs.fuzztime || '120s' }}'
      - name: upload fuzz repros on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-repro-${{ matrix.target }}
          path: |
            internal/simfuzz/testdata/repro/
            internal/simfuzz/testdata/fuzz/
          if-no-files-found: ignore
