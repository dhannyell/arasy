<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Arasy breakout wasm</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
        }

        #game {
            width: 100vw;
            height: 100vh;
        }

        #ff-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
<div id="game">
    <canvas id="ff-canvas"></canvas>
</div>

<script src="wasm_exec.js"></script>
<script>
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("app.wasm"), go.importObject)
        .then(r => go.run(r.instance));
</script>
</body>
</html>
